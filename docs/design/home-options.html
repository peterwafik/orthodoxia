<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home page options 4, 5 and 7</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 2rem 1.5rem 4rem; background: #e6e1d3; font-family: Inter, system-ui, sans-serif; color: #1a2340; }
  h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
  .intro { margin: 0 0 2rem; max-width: 60rem; color: #4b5567; }
  h2 { font-size: 1.05rem; margin: 2.5rem 0 .2rem; }
  .row-note { margin: 0 0 .8rem; color: #4b5567; max-width: 60rem; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(600px, 1fr)); gap: 1.25rem; }
  .label { font-size: .8rem; color: #4b5567; margin: 0 0 .25rem; }

  .panel { position: relative; width: 600px; height: 560px; overflow: hidden; border: 1px solid rgb(0 0 0 / .18); border-radius: 6px; }
  .panel.light { --bg: #f5f1e6; --ink: #1a2340; --muted: #4b5567; --accent: #7a5a12; --card: rgb(255 253 248 / .92); --cardline: #cdbf9c; --art: #7a5a12; --artop: .5; }
  .panel.dark  { --bg: #0e1a33; --ink: #f5f1e6; --muted: #b4bccb; --accent: #d9b45a; --card: rgb(14 26 51 / .88); --cardline: rgb(217 180 90 / .32); --art: #d9b45a; --artop: .42; }
  .panel { background: var(--bg); color: var(--ink); }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--art); opacity: var(--artop); pointer-events: none; }
  .art .bgfill { stroke: var(--bg); }
  .head { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; border-bottom: 1px solid var(--cardline); font-family: "Source Serif 4", Georgia, serif; font-weight: 600; z-index: 2; background: color-mix(in srgb, var(--bg) 85%, transparent); }
  .head .tools { font: 500 12px Inter, sans-serif; color: var(--accent); display: flex; gap: 12px; }
  .hero { position: relative; z-index: 2; padding: 34px 28px 0; }
  .hero h3 { margin: 0 0 10px; font: 600 34px/1.12 "Source Serif 4", Georgia, serif; max-width: 17em; }
  .hero p { margin: 0; font: 17px/1.4 "Source Serif 4", Georgia, serif; color: var(--muted); max-width: 28em; }
  .cards { position: absolute; z-index: 2; inset-inline: 28px; top: 250px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .card { padding: 14px 14px 16px; background: var(--card); border: 1px solid var(--cardline); border-top: 3px solid var(--accent); border-radius: 4px; }
  .card b { display: block; font: 600 17px "Source Serif 4", Georgia, serif; margin-bottom: 5px; }
  .card span { font-size: 12px; line-height: 1.4; color: var(--muted); }
</style>
</head>
<body>
<h1>Home page options 4, 5 and 7</h1>
<p class="intro">Each option in the light theme (the new default) and the dark theme. The drawings are placeholders for the final artwork: the colours, density and position are what to judge. The cards and text are the real home page content, shortened.</p>

<div id="rows"></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (name, attrs = {}, parent) => {
  const e = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.append(e);
  return e;
};
const poly = (points) => 'M' + points.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(' L');

/** A ribbon: an outline stroke with a background-coloured stroke inside it, so it reads as a double line. */
function ribbon(parent, d, width, clip) {
  const g = el('g', clip ? { 'clip-path': `url(#${clip})` } : {}, parent);
  el('path', { d, fill: 'none', stroke: 'currentColor', 'stroke-width': width, 'stroke-linecap': 'butt', 'stroke-linejoin': 'round' }, g);
  el('path', { d, fill: 'none', class: 'bgfill', 'stroke-width': width - 3, 'stroke-linecap': 'butt', 'stroke-linejoin': 'round' }, g);
}

let clipId = 0;
function windowClip(svg, rect) {
  const id = 'c' + clipId++;
  const cp = el('clipPath', { id }, svg);
  el('rect', rect, cp);
  return id;
}

/** A horizontal braid of two strands that pass over and under each other. */
function braid(svg, x0, x1, y, amp, period, width) {
  const strand = (phase) => {
    const pts = [];
    for (let x = x0; x <= x1; x += 2) pts.push([x, y + amp * Math.sin((2 * Math.PI * (x - x0)) / period + phase)]);
    return poly(pts);
  };
  const a = strand(0);
  const b = strand(Math.PI);
  ribbon(svg, a, width);
  ribbon(svg, b, width);
  for (let k = 0; x0 + (k * period) / 2 <= x1; k += 2) {
    const cx = x0 + (k * period) / 2;
    const id = windowClip(svg, { x: cx - width * 1.1, y: y - amp - width, width: width * 2.2, height: 2 * amp + 2 * width });
    ribbon(svg, a, width, id);
  }
}

/** A circular braid around (cx, cy). */
function ring(svg, cx, cy, R, amp, lobes, width) {
  const strand = (phase) => {
    const pts = [];
    for (let i = 0; i <= 720; i++) {
      const t = (i / 720) * 2 * Math.PI;
      const r = R + amp * Math.sin(lobes * t + phase);
      pts.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]);
    }
    return poly(pts) + ' Z';
  };
  const a = strand(0);
  ribbon(svg, a, width);
  ribbon(svg, strand(Math.PI), width);
  for (let k = 0; k < 2 * lobes; k += 2) {
    const t = (k * Math.PI) / lobes;
    const x = cx + R * Math.cos(t);
    const y = cy + R * Math.sin(t);
    const id = windowClip(svg, { x: x - width * 1.2, y: y - width * 1.2, width: width * 2.4, height: width * 2.4 });
    ribbon(svg, a, width, id);
  }
}

/** The brand cross (twelve points), outline only. */
function copticCross(parent, cx, cy, scale, extra = '') {
  const g = el('g', { transform: `translate(${cx} ${cy}) scale(${scale}) translate(-16 -16)`, fill: 'none', stroke: 'currentColor', 'stroke-width': 1.2 / scale * 1, 'stroke-linejoin': 'round' }, parent);
  el('rect', { x: 13.5, y: 6, width: 5, height: 20, rx: 0.5 }, g);
  el('rect', { x: 6, y: 13.5, width: 20, height: 5, rx: 0.5 }, g);
  for (const angle of [0, 90, 180, 270]) {
    const a = el('g', { transform: `rotate(${angle} 16 16)` }, g);
    el('circle', { cx: 16, cy: 2.6, r: 1.9 }, a);
    el('circle', { cx: 12.7, cy: 4.4, r: 1.6 }, a);
    el('circle', { cx: 19.3, cy: 4.4, r: 1.6 }, a);
  }
  return g;
}

/* ---------- option 4: interlaced knotwork ---------- */
function art4(svg) {
  braid(svg, -10, 610, 22, 7, 60, 7);
  braid(svg, -10, 610, 538, 7, 60, 7);
  // a knotted ring with a cross, top-right, behind the headline
  ring(svg, 505, 150, 92, 9, 8, 6);
  copticCross(svg, 505, 150, 3.4);
  // thin frame lines down the sides
  for (const x of [14, 586]) el('path', { d: `M${x} 40 V520`, fill: 'none', stroke: 'currentColor', 'stroke-width': 1 }, svg);
  // corner knots
  for (const [x, y] of [[14, 40], [586, 40], [14, 520], [586, 520]]) el('circle', { cx: x, cy: y, r: 5, fill: 'none', stroke: 'currentColor', 'stroke-width': 1.2 }, svg);
}

/* ---------- option 5: textile pattern ---------- */
function art5(svg) {
  const defs = el('defs', {}, svg);
  const p = el('pattern', { id: 'tile' + clipId, width: 56, height: 56, patternUnits: 'userSpaceOnUse' }, defs);
  const tid = 'tile' + clipId++;
  const g = el('g', { fill: 'none', stroke: 'currentColor', 'stroke-width': 1 }, p);
  // small cross with dots
  el('path', { d: 'M28 20 V36 M20 28 H36' }, g);
  for (const [x, y] of [[28, 17.5], [28, 38.5], [17.5, 28], [38.5, 28]]) el('circle', { cx: x, cy: y, r: 2.2 }, g);
  // lotus petals at the tile corners
  for (const [x, y] of [[0, 0], [56, 0], [0, 56], [56, 56]]) {
    el('path', { d: `M${x} ${y - 10} Q${x + 7} ${y - 3} ${x} ${y + 4} Q${x - 7} ${y - 3} ${x} ${y - 10}` }, g);
    el('path', { d: `M${x - 10} ${y} Q${x - 3} ${y + 7} ${x + 4} ${y} Q${x - 3} ${y - 7} ${x - 10} ${y}` }, g);
  }
  el('rect', { x: 0, y: 0, width: 600, height: 560, fill: `url(#${tid})` }, svg);
  // double frame and corner squares
  for (const inset of [10, 16]) el('rect', { x: inset, y: inset, width: 600 - 2 * inset, height: 560 - 2 * inset, fill: 'none', stroke: 'currentColor', 'stroke-width': 1.2 }, svg);
  for (const [x, y] of [[10, 10], [590, 10], [10, 550], [590, 550]]) {
    el('rect', { x: x - 12, y: y - 12, width: 24, height: 24, fill: 'none', class: 'bgfill', 'stroke-width': 30 }, svg);
    el('rect', { x: x - 11, y: y - 11, width: 22, height: 22, fill: 'none', stroke: 'currentColor', 'stroke-width': 1.2 }, svg);
    el('path', { d: `M${x - 6} ${y} H${x + 6} M${x} ${y - 6} V${y + 6}`, stroke: 'currentColor', 'stroke-width': 1.2 }, svg);
  }
}

/* ---------- option 7: cross, book and arcs ---------- */
function art7(svg) {
  const cx = 300, base = 520;
  // arcs between points on a baseline, like the cross-reference diagram
  const pairs = [[40, 190], [70, 360], [110, 250], [150, 440], [190, 300], [60, 520], [220, 400], [340, 560], [380, 470], [410, 540], [260, 330], [90, 200], [450, 530], [20, 120]];
  for (const [a, b] of pairs) {
    const r = (b - a) / 2;
    el('path', { d: `M${a} ${base} A${r} ${Math.min(r, 105)} 0 0 1 ${b} ${base}`, fill: 'none', stroke: 'currentColor', 'stroke-width': 1, opacity: 0.8 }, svg);
  }
  el('path', { d: `M0 ${base} H600`, stroke: 'currentColor', 'stroke-width': 1.2 }, svg);
  // open book on the baseline
  const book = el('g', { fill: 'none', stroke: 'currentColor', 'stroke-width': 1.4, 'stroke-linejoin': 'round' }, svg);
  el('path', { d: `M${cx} ${base} C${cx - 20} ${base - 12} ${cx - 62} ${base - 14} ${cx - 90} ${base - 4} V${base - 46} C${cx - 62} ${base - 56} ${cx - 20} ${base - 54} ${cx} ${base - 42} C${cx + 20} ${base - 54} ${cx + 62} ${base - 56} ${cx + 90} ${base - 46} V${base - 4} C${cx + 62} ${base - 14} ${cx + 20} ${base - 12} ${cx} ${base} Z` }, book);
  el('path', { d: `M${cx} ${base - 42} V${base}` }, book);
  for (const dy of [14, 24, 34]) {
    el('path', { d: `M${cx - 76} ${base - 44 + dy - 14} C${cx - 56} ${base - 48 + dy - 14} ${cx - 30} ${base - 46 + dy - 14} ${cx - 10} ${base - 38 + dy - 14}`, opacity: 0.6 }, book);
    el('path', { d: `M${cx + 76} ${base - 44 + dy - 14} C${cx + 56} ${base - 48 + dy - 14} ${cx + 30} ${base - 46 + dy - 14} ${cx + 10} ${base - 38 + dy - 14}`, opacity: 0.6 }, book);
  }
  // cross above the book, with rays and rings
  const ccy = 436;
  for (let i = 0; i < 36; i++) {
    const ang = (-170 + i * (160 / 35)) * Math.PI / 180;
    const r1 = 40, r2 = i % 3 === 0 ? 70 : 56;
    el('path', { d: `M${cx + r1 * Math.cos(ang)} ${ccy + r1 * Math.sin(ang)} L${cx + r2 * Math.cos(ang)} ${ccy + r2 * Math.sin(ang)}`, stroke: 'currentColor', 'stroke-width': 1 }, svg);
  }
  for (const r of [34, 78]) el('path', { d: `M${cx - r} ${ccy} A${r} ${r} 0 0 1 ${cx + r} ${ccy}`, fill: 'none', stroke: 'currentColor', 'stroke-width': 1 }, svg);
  copticCross(svg, cx, ccy - 4, 2.1);
}

const OPTIONS = [
  { n: 4, title: 'Option 4: interlaced Coptic knotwork', note: 'Braided bands run along the top and bottom of the page and loop into a ring around the cross. Thin side lines and corner knots close the frame. It is the most distinctly Coptic of the three and is dense at the edges, quiet in the middle.', art: art4 },
  { n: 5, title: 'Option 5: Coptic textile pattern', note: 'A repeating weave of small crosses and lotus petals covers the page in the manner of Coptic cloth, inside a double frame with square corners. Very faint, so it reads as texture. Cards sit on solid patches.', art: art5 },
  { n: 7, title: 'Option 7: cross, book and arcs', note: 'An open book rests on a baseline under a cross with rays, and arcs rise from the line like the cross-reference diagram. It says what the site is for, and the lower half carries the picture.', art: art7 },
];

const CARDS = [
  ['Read the Bible', 'Arabic and English, with topic markers.'],
  ['Cross-references', 'Every verse, with its connections as arcs.'],
  ['The Holy Mass', 'The Divine Liturgy step by step.'],
];

function panel(option, theme) {
  const p = document.createElement('div');
  p.className = `panel ${theme}`;
  const svg = el('svg', { class: 'art', viewBox: '0 0 600 560', width: 600, height: 560 });
  option.art(svg);
  p.append(svg);
  p.insertAdjacentHTML('beforeend', `
    <div class="head"><span>Orthodoxia</span><span class="tools"><span>العربية</span><span>◐</span></span></div>
    <div class="hero"><h3>Explore Scripture. Discover its connections.</h3><p>An interconnected library of Scripture, early Christian history and Church Fathers.</p></div>
    <div class="cards">${CARDS.map(([t, n]) => `<div class="card"><b>${t}</b><span>${n}</span></div>`).join('')}</div>`);
  return p;
}

const rows = document.getElementById('rows');
for (const option of OPTIONS) {
  const h = document.createElement('h2'); h.textContent = option.title;
  const note = document.createElement('p'); note.className = 'row-note'; note.textContent = option.note;
  const pair = document.createElement('div'); pair.className = 'pair';
  for (const theme of ['light', 'dark']) {
    const wrap = document.createElement('div');
    const label = document.createElement('p'); label.className = 'label'; label.textContent = theme === 'light' ? 'Light (default)' : 'Dark';
    wrap.append(label, panel(option, theme));
    pair.append(wrap);
  }
  rows.append(h, note, pair);
}
</script>
</body>
</html>
