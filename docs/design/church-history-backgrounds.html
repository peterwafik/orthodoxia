<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Church history background options</title>
<style>
  body { margin: 0; padding: 2rem 1.5rem 4rem; background: #e6e1d3; font-family: Inter, system-ui, sans-serif; color: #1a2340; }
  h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
  .intro { margin: 0 0 1rem; max-width: 60rem; color: #4b5567; }
  h2 { font-size: 1.1rem; margin: 2.5rem 0 .2rem; }
  .note { margin: 0 0 .8rem; color: #4b5567; max-width: 60rem; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(600px, 1fr)); gap: 1.25rem; }
  .label { font-size: .8rem; color: #4b5567; margin: 0 0 .25rem; }

  .panel { position: relative; width: 600px; height: 660px; overflow: hidden; border: 1px solid rgb(0 0 0 / .18); border-radius: 6px; }
  .panel.light { --bg: #f5f1e6; --ink: #1a2340; --muted: #4b5567; --accent: #7a5a12; --line: #ddd5c3; --card: #fffdf8; --art: #7a5a12; --lightness: 38%; --sat: 55%; }
  .panel.dark  { --bg: #0e1a33; --ink: #f5f1e6; --muted: #b4bccb; --accent: #d9b45a; --line: #2a3a60; --card: #16244a; --art: #d9b45a; --lightness: 66%; --sat: 62%; }
  .panel { background: var(--bg); color: var(--ink); }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--art); pointer-events: none; }
  .art .bgfill { stroke: var(--bg); }
  .head { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 13px 22px; border-bottom: 1px solid var(--line); font: 600 16px "Source Serif 4", Georgia, serif; }
  .head .tools { font: 500 12px Inter, sans-serif; color: var(--accent); }
  .hero { position: relative; z-index: 2; padding: 22px 28px 0; }
  .hero h3 { margin: 0 0 8px; font: 600 38px/1.1 "Source Serif 4", Georgia, serif; }
  .hero p { margin: 0; font: 15px/1.4 "Source Serif 4", Georgia, serif; color: var(--muted); max-width: 30em; }
  .panel.inset .hero { padding-inline: 80px; }
  .panel.inset .tl { transform: scale(0.86); transform-origin: 50% 0; }
  .panel.inset .compare { left: 80px; right: 80px; }
  .tl { position: absolute; z-index: 2; left: 0; top: 176px; width: 600px; height: 300px; }
  .tl text { font: 600 11px Inter, sans-serif; fill: var(--muted); }
  .compare { position: absolute; z-index: 2; left: 28px; right: 28px; top: 468px; }
  .compare b { font: 600 18px "Source Serif 4", Georgia, serif; }
  .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chip { padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 11px; }
</style>
</head>
<body>
<h1>Church history background options</h1>
<p class="intro">Each option below in the light theme (left) and the dark theme (right). The drawing appears only in certain areas; the timeline area stays clear. The timeline here is a sketch; the drawings are placeholders for the final artwork.</p>
<div id="rows"></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (name, attrs = {}, parent) => { const e = document.createElementNS(NS, name); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.append(e); return e; };
const poly = (pts) => 'M' + pts.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(' L');
const stroke = { fill: 'none', stroke: 'currentColor', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
let uid = 0;

function ribbon(parent, d, w, clip) {
  const g = el('g', clip ? { 'clip-path': `url(#${clip})` } : {}, parent);
  el('path', { d, ...stroke, 'stroke-width': w, 'stroke-linecap': 'butt' }, g);
  el('path', { d, fill: 'none', class: 'bgfill', 'stroke-width': w - 3 }, g);
}
function windowClip(svg, rect) { const id = 'c' + uid++; el('rect', rect, el('clipPath', { id }, svg)); return id; }
function braid(svg, x0, x1, y, amp, period, w) {
  const strand = (ph) => { const pts = []; for (let x = x0; x <= x1; x += 2) pts.push([x, y + amp * Math.sin((2 * Math.PI * (x - x0)) / period + ph)]); return poly(pts); };
  const a = strand(0);
  ribbon(svg, a, w); ribbon(svg, strand(Math.PI), w);
  for (let k = 0; x0 + (k * period) / 2 <= x1; k += 2) {
    const cx = x0 + (k * period) / 2;
    ribbon(svg, a, w, windowClip(svg, { x: cx - w * 1.1, y: y - amp - w, width: w * 2.2, height: 2 * amp + 2 * w }));
  }
}
function ring(svg, cx, cy, R, amp, lobes, w) {
  const strand = (ph) => { const pts = []; for (let i = 0; i <= 720; i++) { const t = (i / 720) * 2 * Math.PI; const r = R + amp * Math.sin(lobes * t + ph); pts.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]); } return poly(pts) + ' Z'; };
  const a = strand(0);
  ribbon(svg, a, w); ribbon(svg, strand(Math.PI), w);
  for (let k = 0; k < 2 * lobes; k += 2) { const t = (k * Math.PI) / lobes; const x = cx + R * Math.cos(t), y = cy + R * Math.sin(t); ribbon(svg, a, w, windowClip(svg, { x: x - w * 1.2, y: y - w * 1.2, width: w * 2.4, height: w * 2.4 })); }
}
function copticCross(parent, cx, cy, scale, sw = 1.2) {
  const g = el('g', { transform: `translate(${cx} ${cy}) scale(${scale}) translate(-16 -16)`, ...stroke, 'stroke-width': sw / scale }, parent);
  el('rect', { x: 13.5, y: 6, width: 5, height: 20, rx: 0.5 }, g);
  el('rect', { x: 6, y: 13.5, width: 20, height: 5, rx: 0.5 }, g);
  for (const angle of [0, 90, 180, 270]) { const a = el('g', { transform: `rotate(${angle} 16 16)` }, g); el('circle', { cx: 16, cy: 2.6, r: 1.9 }, a); el('circle', { cx: 12.7, cy: 4.4, r: 1.6 }, a); el('circle', { cx: 19.3, cy: 4.4, r: 1.6 }, a); }
}
const plainCross = (parent, x, y, h) => el('path', { d: `M${x} ${y} v${-h} M${x - h * 0.4} ${y - h * 0.62} h${h * 0.8}`, ...stroke, 'stroke-width': 1.2 }, parent);
const fadeMask = (svg, id, stops) => {
  const defs = el('defs', {}, svg);
  const lg = el('linearGradient', { id: id + 'g', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  for (const [o, a] of stops) el('stop', { offset: o, 'stop-color': '#fff', 'stop-opacity': a }, lg);
  const m = el('mask', { id }, defs);
  el('rect', { width: 600, height: 660, fill: `url(#${id}g)` }, m);
  return id;
};

/* 1: corner medallions and braided bands */
function art1(svg) {
  braid(svg, -10, 610, 12, 5, 44, 5);
  braid(svg, -10, 610, 648, 5, 44, 5);
  for (const x of [40, 560]) { ring(svg, x, 100, 24, 4, 8, 4); copticCross(svg, x, 100, 1.1, 0.9); }
  for (const x of [40, 560]) { ring(svg, x, 600, 24, 4, 8, 4); copticCross(svg, x, 600, 1.1, 0.9); }
  for (const x of [40, 560]) el('path', { d: `M${x} 130 V570`, ...stroke, 'stroke-width': 1, opacity: 0.45 }, svg);
}
/* 2: arcade behind the header */
function art2(svg) {
  const id = fadeMask(svg, 'm2', [[0, 1], [0.62, 0.9], [0.9, 0]]);
  const g = el('g', { mask: `url(#${id})`, ...stroke, 'stroke-width': 1.2 }, svg);
  const base = 230;
  for (let i = 0; i < 9; i++) {
    const x = i * 70 - 15;
    el('path', { d: `M${x} ${base} V150 A35 35 0 0 1 ${x + 70} 150 V${base}`, opacity: 0.8 }, g);
    el('path', { d: `M${x + 12} ${base} V156 A23 23 0 0 1 ${x + 58} 156 V${base}`, opacity: 0.45 }, g);
  }
  el('path', { d: `M0 ${base} H600 M0 ${base - 8} H600`, opacity: 0.6 }, g);
  el('path', { d: `M255 ${base} V120 A45 45 0 0 1 345 120 V${base}`, 'stroke-width': 1.6 }, g);
  plainCross(g, 300, 70, 34);
  el('path', { d: 'M0 70 H600', opacity: 0.3 }, g);
}
/* 3: vine on the left, wheat on the right */
function art3(svg) {
  const top = 70, bottom = 640;
  const stem = []; for (let y = top; y <= bottom; y += 4) stem.push([30 + 9 * Math.sin((y - top) / 38), y]);
  el('path', { d: poly(stem), ...stroke, 'stroke-width': 1.4 }, svg);
  for (let y = top + 30; y < bottom - 20; y += 64) {
    const x = 30 + 9 * Math.sin((y - top) / 38);
    el('path', { d: `M${x} ${y} Q${x + 22} ${y - 20} ${x + 34} ${y - 4} Q${x + 18} ${y + 6} ${x} ${y}`, ...stroke, 'stroke-width': 1.1 }, svg);
    el('path', { d: `M${x} ${y + 30} Q${x - 22} ${y + 12} ${x - 30} ${y + 28} Q${x - 14} ${y + 40} ${x} ${y + 30}`, ...stroke, 'stroke-width': 1.1, transform: 'translate(0 2)' }, svg);
    const gx = x + 4, gy = y + 46;
    for (const [dx, dy] of [[0, 0], [8, 0], [-8, 0], [4, 8], [-4, 8], [0, 16]]) el('circle', { cx: gx + dx, cy: gy + dy, r: 4, ...stroke, 'stroke-width': 1 }, svg);
  }
  const wx = 570;
  el('path', { d: `M${wx} ${top} V${bottom}`, ...stroke, 'stroke-width': 1.4 }, svg);
  for (let y = top + 10; y < bottom - 40; y += 34) {
    for (const s of [-1, 1]) {
      el('path', { d: `M${wx} ${y + 14} Q${wx + s * 14} ${y + 6} ${wx + s * 12} ${y - 8} Q${wx + s * 2} ${y} ${wx} ${y + 14}`, ...stroke, 'stroke-width': 1 }, svg);
    }
  }
  for (const s of [-1, 1]) el('path', { d: `M${wx} ${bottom - 30} Q${wx + s * 26} ${bottom - 50} ${wx + s * 34} ${bottom - 90}`, ...stroke, 'stroke-width': 1.1 }, svg);
}
/* 4: skyline and desert at the foot of the page */
function art4(svg) {
  const id = fadeMask(svg, 'm4', [[0.78, 0], [0.9, 1], [1, 1]]);
  const g = el('g', { mask: `url(#${id})`, ...stroke, 'stroke-width': 1.3 }, svg);
  const base = 650;
  el('path', { d: `M0 ${base} H600 M0 ${base - 7} H600`, opacity: 0.6 }, g);
  el('path', { d: `M215 ${base} V614 H385 V${base} M215 614 H385` }, g);
  el('path', { d: 'M228 614 A72 40 0 0 1 372 614' }, g);
  plainCross(g, 300, 574, 22);
  el('path', { d: `M262 ${base} V634 A13 13 0 0 1 288 634 V${base} M312 ${base} V634 A13 13 0 0 1 338 634 V${base}` }, g);
  for (const cx of [120, 480]) {
    el('path', { d: `M${cx - 30} ${base} V630 H${cx + 30} V${base}` }, g);
    el('path', { d: `M${cx - 26} 630 A26 18 0 0 1 ${cx + 26} 630` }, g);
    plainCross(g, cx, 612, 16);
  }
  for (const [cx, sgn] of [[34, 1], [566, -1]]) {
    el('path', { d: `M${cx} ${base} Q${cx + 5 * sgn} 625 ${cx + 2 * sgn} 604` }, g);
    for (const a of [-60, -25, 15, 55]) el('path', { d: `M${cx + 2 * sgn} 604 q${18 * sgn * Math.cos((a * Math.PI) / 180)} ${-10 + 6 * Math.sin((a * Math.PI) / 180)} ${28 * sgn} ${8 + a / 9}` }, g);
  }
  el('path', { d: 'M0 646 Q80 636 160 646 T320 646 T480 646 T600 642', opacity: 0.5 }, g);
}
/* 5: one large faint cross and halo behind the title */
function art5(svg) {
  const g = el('g', { opacity: 0.55 }, svg);
  const cx = 470, cy = 120;
  for (const r of [150, 130]) el('circle', { cx, cy, r, ...stroke, 'stroke-width': 1.2, 'stroke-dasharray': r === 130 ? '2 6' : '' }, g);
  for (let i = 0; i < 60; i++) { const a = (i * 6 * Math.PI) / 180; const r1 = 150, r2 = i % 5 === 0 ? 168 : 160; el('path', { d: `M${cx + r1 * Math.cos(a)} ${cy + r1 * Math.sin(a)} L${cx + r2 * Math.cos(a)} ${cy + r2 * Math.sin(a)}`, ...stroke, 'stroke-width': 1 }, g); }
  copticCross(g, cx, cy, 5.2, 1.2);
}

/* the timeline sketch drawn over the art */
function timeline(panel) {
  const svg = el('svg', { class: 'tl', viewBox: '0 0 600 300' });
  const lane = (n) => 150 + n * 24;
  const threads = [
    [-3, 'Ethiopian', 150, 90], [-2, 'Church of the East', 22, 130], [-1, 'Syriac', 190, 160],
    [0, 'Coptic Orthodox', null, 60],
    [1, 'Eastern Orthodox', 215, 110], [2, 'Roman Catholic', 350, 200], [3, 'Lutheran', 100, 330], [4, 'Reformed', 170, 340], [5, 'Anglican', 265, 360],
  ];
  for (const [n, name, hue, x0] of threads) {
    const y = lane(n);
    const color = hue === null ? 'var(--accent)' : `hsl(${hue} var(--sat) var(--lightness))`;
    const d = n === 0 ? `M30 ${y} H470` : `M${x0} ${lane(n > 0 ? Math.max(0, n - 1) : 0)} C${x0 + 24} ${lane(n > 0 ? Math.max(0, n - 1) : 0)} ${x0 + 24} ${y} ${x0 + 48} ${y} H470`;
    el('path', { d, fill: 'none', stroke: color, 'stroke-width': n === 0 ? 4 : 2.5, 'stroke-linecap': 'round', opacity: n === 0 ? 0.9 : 0.75 }, svg);
    const t = el('text', { x: 478, y: y + 4 }, svg); t.textContent = name;
  }
  panel.append(svg);
}

const OPTIONS = [
  { n: 1, inset: true, title: 'Option 1: corner medallions and braided bands', note: 'A knotted cross medallion in each corner and a thin braid along the top and bottom edges. Everything between them is clear.', art: art1 },
  { n: 2, title: 'Option 2: arcade behind the header', note: 'A row of arches with a cross in the central arch frames the title and intro, then fades out before the timeline.', art: art2 },
  { n: 3, inset: true, title: 'Option 3: vine and wheat in the side margins', note: 'A grapevine on one side and a wheat stalk on the other, as Eucharistic symbols. They sit in the outer margins and are hidden on narrow screens.', art: art3 },
  { n: 4, title: 'Option 4: church and monastery skyline at the foot', note: 'Domes, a cross, palms and desert dunes along the bottom of the page. It closes the page under the comparison section.', art: art4 },
  { n: 5, title: 'Option 5: one large cross and halo behind the title', note: 'A single faint Coptic cross inside a ring of rays at the top corner. The rest of the page is plain.', art: art5 },
];

function panel(option, theme) {
  const p = document.createElement('div');
  p.className = `panel ${theme}${option.inset ? ' inset' : ''}`;
  const svg = el('svg', { class: 'art', viewBox: '0 0 600 660', width: 600, height: 660 });
  option.art(svg);
  p.append(svg);
  p.insertAdjacentHTML('beforeend', `
    <div class="head"><span>Orthodoxia</span><span class="tools">العربية &nbsp; ◐</span></div>
    <div class="hero"><h3>Church history</h3><p>How the early church divided into the churches of today, drawn as one timeline.</p></div>
    <div class="compare"><b>Compare churches</b><div class="chips"><span class="chip">Coptic Orthodox</span><span class="chip">Roman Catholic</span><span class="chip">Lutheran</span><span class="chip">Anglican</span></div></div>`);
  timeline(p);
  return p;
}

const rows = document.getElementById('rows');
for (const option of OPTIONS) {
  const h = document.createElement('h2'); h.textContent = option.title;
  const note = document.createElement('p'); note.className = 'note'; note.textContent = option.note;
  const pair = document.createElement('div'); pair.className = 'pair';
  for (const theme of ['light', 'dark']) {
    const wrap = document.createElement('div');
    const label = document.createElement('p'); label.className = 'label'; label.textContent = theme === 'light' ? 'Light (default)' : 'Dark';
    wrap.append(label, panel(option, theme));
    pair.append(wrap);
  }
  rows.append(h, note, pair);
}
</script>
</body>
</html>
