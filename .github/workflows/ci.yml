name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  # The public URL of the deployed site, for canonical and share links. Set the repository variable
  # SITE_ORIGIN once the Cloudflare subdomain is known (docs/DEPLOYMENT.md).
  SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://orthodoxia.workers.dev' }}

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # Builds both apps into dist/ and fails on files over 25 MiB or more than 20,000 files.
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Skip when Cloudflare is not configured yet
        id: configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; skipping deployment (see docs/DEPLOYMENT.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
      - name: Deploy static assets
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy
