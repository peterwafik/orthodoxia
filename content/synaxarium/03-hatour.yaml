month: 3
review: { status: draft, origin: ai-generated }
days:
  "1":
    en: ["Maximus, Numitius, Victor and Philip were Christians from Africa who loved one another like brothers. In the days of Emperor Diocletian they openly declared their faith, endured beatings and burns without giving up, and were martyred by the sword.", "Cleopas was one of the Seventy apostles. He and his companion were walking to the village of Emmaus when the risen Lord Jesus joined them, explained the prophets, and was recognized by them when He broke the bread."]
    ar: [null, "كان مكسيموس ونوميتيوس وبقطر وفيلبس مسيحيين من أفريقية جمعتهم محبة روحية. في أيام الملك دقلديانوس أعلنوا إيمانهم بالمسيح أمام الأمير، فاحتملوا الضرب والحرق بصبر حتى آمن بعض الحاضرين، ثم نالوا إكليل الشهادة بالسيف.", "كليوباس من الرسل الاثنين والسبعين. كان سائرًا مع رفيقه إلى قرية عمواس، فرافقهما الرب يسوع بعد قيامته وشرح لهما النبوات، وعرفاه عندما بارك الخبز وكسره ثم اختفى عنهما.", null]
  "2":
    en: ["Peter the Third became the 27th Pope of Alexandria. He exchanged letters of shared Orthodox faith with Acacius, Patriarch of Constantinople. Though exiled once, he kept teaching his flock by letters, and he departed in peace in 481 after eight years as pope."]
    ar: ["البابا بطرس الثالث هو السابع والعشرون من باباوات الإسكندرية. تبادل الرسائل مع القديس أكاكيوس بطريرك القسطنطينية واتفقا على الإيمان المستقيم. احتمل شدائد ونُفي مرة، لكنه ظل يعلّم شعبه برسائله، وتنيح بسلام سنة 481م بعد ثماني سنين.", null, null, null]
  "3":
    en: ["Cyriacus grew up in Corinth, Greece, and became a monk in Palestine under Abba Euthymius after Saint Cyril of Jerusalem blessed him. God gave him the gift of healing. He went with Cyril to the Council of Constantinople and opposed Macedonius, enemy of the Holy Spirit.", "Athanasius and his sister Irene were tortured by Maximianus for their faith in Christ. When he could not turn them away, he had them thrown into an empty pit and sealed it over them, and they departed there."]
    ar: ["نشأ القديس كرياكوس في مدينة قورنثية باليونان، وترهب في فلسطين على يد الأب أوتيموس بعد أن باركه القديس كيرلس أسقف أورشليم. وهبه الله نعمة شفاء المرضى، ورافق كيرلس إلى مجمع القسطنطينية وقاوم مقدونيوس عدو الروح القدس.", "عُذّب القديس أثناسيوس وأخته إيريني على يد مكسيميانوس بسبب إيمانهما بالمسيح. ولما عجز عن ردهما عن إيمانهما، أمر بإلقائهما في جب فارغ وإغلاقه عليهما، فتنيحا فيه.", null]
  "4":
    en: ["John and James were bishops in Persia. When King Sapor son of Hormuz ordered them to worship the sun and fire, they refused and kept strengthening their people in the faith even under torture, so he had them thrown into the fire.", "Epimachus and Adrianus were from Rome. Accused before the governor under Emperor Maximianus, they confessed Christ boldly and rebuked him for worshipping idols that cannot speak or see, so he ordered them beheaded."]
    ar: ["كان يوحنا ويعقوب أسقفين في أرض فارس. رفضا أمر الملك سابور بن هرمز بالسجود للشمس والنار، وظلا يثبتان الشعب على الإيمان حتى وهما يُعذبان، فأمر بطرحهما في النار ونالا إكليل المجد.", null, "كان أبيماخوس وعزاريانوس من مدينة رومية. وشى بهما البعض عند الوالي في عهد الملك مكسيميانوس، فاعترفا بالمسيح بجرأة ووبخاه على عبادة أصنام لا تنطق ولا تبصر، فأمر بقطع رأسيهما."]
  "5":
    en: ["Longinus was the soldier who pierced the Savior's side on the cross. After his martyrdom his head was buried outside Jerusalem. Later he appeared in a dream to a blind woman who had believed through him; she found the head and her sight returned.", "On this day the Church remembers the martyrdom of Saint Timothy and the moving of the body of Saint Theodore the Prince to the town of Shotb, in the region of Asyut."]
    ar: ["لونجينوس هو الجندي الذي طعن جنب المخلص بالحربة على الصليب. بعد استشهاده دُفن رأسه خارج أورشليم، ثم ظهر في حلم لامرأة عمياء كانت قد آمنت على يديه فأرشدها إلى مكانه، ولما وجدته انفتحت عيناها.", "في هذا اليوم تذكر الكنيسة استشهاد القديس تيموثاوس، ونقل جسد القديس الأمير تادرس إلى بلدة شطب من أعمال أسيوط.", null, null]
  "6":
    en: ["Felix was born in Rome to Christian parents and became Pope of Rome, caring for his flock through cruel persecutions. He prayed not to see Christians tortured under Diocletian, and departed in that emperor's first year after five and a half years, leaving many writings.", "This day remembers the consecration of the Church of the Virgin Mary at the Muharraq Monastery on Mount Qusqam. Saints Philotheus and Cyril, Patriarchs of Alexandria, testified that the Lord Jesus Christ came with His disciples and blessed it at its consecration."]
    ar: ["وُلد القديس فيلكس في رومية من أبوين مسيحيين، وصار بابا لرومية فرعى شعبه في زمن الاضطهاد. صلى ألا يرى عذاب المسيحيين في أيام دقلديانوس، فتنيح في السنة الأولى من ملكه بعد خمس سنوات ونصف، تاركًا كتابات كثيرة.", "تذكار تكريس كنيسة السيدة العذراء بدير المحرق بجبل قسقام. وقد شهد القديسان فيلوثاؤس وكيرلس بطريركا الإسكندرية بأن الرب يسوع المسيح حلّ فيها مع تلاميذه وباركها وقت تكريسها."]
  "7":
    en: ["George of Alexandria was born after his father prayed at Saint George's church in Lydda. A young man kind to the poor, he led his cousin, the governor's daughter, to faith in Christ. She was martyred, and he was then tortured and beheaded in Ansena.", "Nehroua was a God-fearing man from Fayoum who longed to die for Christ. The Archangel Michael carried him to Antioch, where he confessed Christ before Diocletian, endured many tortures, and was beheaded. Saint Julius of Aqfahs sent his body home.", "Mina, from Samanoud, became a monk at the Monastery of Saint Macarius and was later ordained Bishop of Tamai. God gave him gifts of healing and of knowing hidden thoughts, and he laid hands on four Popes of Alexandria at their ordination.", "This day remembers the consecration of Saint George's church in Lydda, famous for its wonders. An officer sent by Diocletian to destroy it mocked the saint's icon, was struck down and died, and the churches later reopened under the righteous Emperor Constantine."]
    ar: ["تذكار تكريس كنيسة الشهيد العظيم جاؤرجيوس بمدينة اللد التي اشتهرت بعجائبها. أرسل دقلديانوس قائدًا لهدمها فاستهزأ بأيقونة القديس فسقط ومات في الطريق، ثم فُتحت الكنائس في عهد الملك البار قسطنطين.", "وُلد جاؤرجيوس الإسكندري بعد أن صلى أبوه في كنيسة الشهيد جاؤرجيوس باللد. كان رحومًا بالمساكين، وهدى ابنة خاله والي الإسكندرية إلى الإيمان فاستشهدت، ثم عُذّب هو وقُطع رأسه في أنصنا.", "كان نهروه من بلاد الفيوم وكان يشتهي أن يموت على اسم المسيح. حمله الملاك ميخائيل إلى إنطاكية فاعترف بالمسيح أمام دقلديانوس، واحتمل عذابات كثيرة ثم قُطع رأسه، وأرسل القديس يوليوس الإقفهصي جسده إلى بلده.", null, "كان الأنبا مينا من أهل سمنود، وترهب بدير القديس مقاريوس، ثم رُسم أسقفًا على تمي الأمديد. أعطاه الرب نعمة شفاء المرضى ومعرفة الخفايا، ووضع يده على أربعة من بطاركة الإسكندرية عند رسامتهم."]
  "8":
    en: ["The Church honors the four incorporeal living creatures around God's throne, seen by Isaiah, Ezekiel and John in Revelation. They have faces like a lion, a calf, a man and an eagle, and they praise God without ceasing: Holy, Holy, Holy."]
    ar: ["تذكار الأربعة الحيوانات غير المتجسدين الذين حول عرش الله، كما رآهم إشعياء وحزقيال ويوحنا في سفر الرؤيا. لهم وجوه كأسد وعجل وإنسان ونسر، ويسبحون الله بلا انقطاع قائلين: قدوس قدوس قدوس.", null, null, null]
  "9":
    en: ["Isaac, born in Borollos, became a monk in the wilderness of Saint Macarius and did not seek the praise of people. Chosen by divine revelation as the 41st Pope of Alexandria, he renewed many churches, including Saint Mark's, and departed in peace in 679.", "In 325, in the days of the righteous Emperor Constantine, 318 fathers met at Nicea to judge Arius, who taught that the Son is not equal to the Father. They excommunicated him, wrote the Creed of faith, and fixed the date of Easter."]
    ar: ["في سنة 325م اجتمع الآباء الثلاثمائة والثمانية عشر في نيقية أيام الملك البار قسطنطين لمحاكمة أريوس الذي أنكر مساواة الابن للآب في الجوهر. فحرموه ووضعوا قانون الإيمان، وحددوا موعد عيد القيامة.", "وُلد الأنبا إسحق في البرلس وترهب في برية القديس مكاريوس، وكان زاهدًا في مجد الناس. اختير بإعلان إلهي ليصير البابا الحادي والأربعين، فجدد كنائس كثيرة منها كنيسة مار مرقس، وتنيح بسلام سنة 679م."]
  "10":
    en: ["Sophia was the abbess of a convent of virgins in Edessa, where fifty nuns lived in fasting and prayer. When Julian the Apostate passed by on his way to fight the Persians, his soldiers killed them all with the sword.", "A holy council met in Rome in the days of Pope Victor of Rome and Pope Demetrius of Alexandria. Demetrius had set the rules for calculating the fasts and movable feasts; the council approved them, arranging Great Lent and Easter as the Coptic Church keeps them today."]
    ar: ["كانت القديسة صوفية رئيسة دير للعذارى بالرها، تعيش فيه خمسون راهبة في الصوم والصلاة. ولما مر يوليانوس الملك العاصي بالمدينة في طريقه لمحاربة الفرس، أمر جنوده بقتلهن بالسيف فنلن إكليل الشهادة.", "اجتمع مجمع مقدس برومية في أيام فكتور بابا رومية وديمتريوس بابا الإسكندرية. وكان ديمتريوس قد وضع قواعد حساب الأصوام والأعياد المتنقلة، فأقرها المجمع، وبذلك ترتب الصوم الكبير وعيد القيامة كما تحفظهما كنيستنا اليوم."]
  "11":
    en: ["Anna was the wife of the righteous Joachim and the mother of the Virgin Mary. She was barren and kept praying to God, and He gave her a daughter, the Virgin Mary, mother of the Savior of the world.", null]
    ar: ["القديسة حنة هي زوجة الصديق يواقيم ووالدة السيدة العذراء مريم. كانت عاقرًا فظلت تتوسل إلى الله، فرزقها ابنة هي العذراء مريم أم مخلص العالم، وفي ذلك دليل على فضائلها وتقواها.", null, null]
  "12":
    en: ["The Church celebrates Archangel Michael, head of the heavenly hosts, who intercedes for mankind. Among his wonders, he helped a poor couple, Dorotheus and Theopiste, who kept his feast every month, by blessing their feast and leaving gold inside a fish."]
    ar: ["تعيد الكنيسة لرئيس الملائكة ميخائيل رئيس الأجناد السمائية الذي يشفع في البشر. ومن عجائبه أنه أعان الزوجين الفقيرين ذوروثاؤس وثاؤبستي اللذين كانا يعيدان له كل شهر، فبارك عيدهما وترك لهما ذهبًا في بطن سمكة.", null]
  "13":
    en: ["Timothy became a monk while young and was chosen Bishop of Ansena. He was imprisoned and tortured for three years under Diocletian. Freed under Constantine, he prayed for the governor who had tortured him; the governor believed, was baptized and became a monk.", "Zacharias, a priest of Alexandria, was chosen as the 64th Pope after he slipped down the church stairs while the jar in his hand stayed unbroken. Thrown to lions by Caliph al-Hakim, he was not harmed. He rebuilt churches and departed in 1027."]
    ar: ["كان زخارياس قسًا في الإسكندرية، واختير البابا الرابع والستين بعدما سقط من سلم الكنيسة وظلت الجرة في يده سالمة. ألقاه الحاكم بأمر الله للسباع فلم تؤذه، واهتم ببناء الكنائس، وتنيح سنة 1027م.", null, null, "ترهب الأنبا تيموثاوس منذ صغره ثم اختير أسقفًا على أنصنا. سُجن وعُذب ثلاث سنوات في أيام دقلديانوس، ولما أُطلق في عهد قسطنطين صلى من أجل الوالي الذي عذبه، فآمن الوالي واعتمد وترهب.", null]
  "14":
    en: ["Martin was born in Savaria to Christian parents and firmly resisted the Arians, who attacked him, so he lived in a cave by the sea until he was chosen Bishop of Thrace. Among his miracles, his prayer raised a dead man to expose a false debt claim."]
    ar: ["وُلد القديس مرتينوس بمدينة سافارية من أبوين مسيحيين، وقاوم الأريوسيين فاضطهدوه، فسكن مغارة قرب البحر. ثم اختير أسقفًا على ثراكي، ومن آياته أنه صلى فقام ميت ليكشف كذب رجل ادعى عليه دينًا.", null, null]
  "15":
    en: ["Mina, son of the governor Eudoxius, was born after his mother prayed before an icon of the Virgin. Under Diocletian he left his post, confessed Christ and was beheaded. His body rests at Mariout, where many miracles happened and Pope Cyril VI built a monastery."]
    ar: ["وُلد مار مينا بعد صلاة أمه أمام أيقونة العذراء، وكان أبوه اوذكسيوس واليًا. في أيام دقلديانوس ترك ولايته واعترف بالمسيح فقُطع رأسه. استقر جسده في مريوط حيث جرت عجائب كثيرة، وبنى البابا كيرلس السادس هناك ديرًا باسمه.", null, null]
  "16":
    en: ["Today the Coptic Church begins the Nativity Fast. It lasts 43 days: 40 days after the example of Moses, who fasted before receiving the tablets of the Law, and 3 days remembering the fast of the moving of the Mokattam mountain.", "This day remembers the consecration of the church of Saint Abu-Nofer the hermit, which stood outside Misr.", "Yostus was a bishop who was harshly tortured by Prince Maximus and then received the crown of martyrdom."]
    ar: ["يبدأ اليوم صوم الميلاد المجيد في كنيستنا القبطية. مدته 43 يومًا: أربعون يومًا مثال صوم موسى النبي لاستلام لوحي الشريعة، وثلاثة أيام تذكار صوم نقل جبل المقطم.", "تذكار تكريس كنيسة القديس أبو نفر السائح التي كانت بظاهر مصر.", null, "القديس يسطس أسقف عذبه الأمير مكسيموس عذابًا شديدًا، ثم نال إكليل الشهادة.", null]
  "17":
    en: ["John Chrysostom was born in Antioch around 347, became a monk, and was famous for his preaching. As Patriarch of Constantinople he boldly defended a poor widow whose garden Empress Eudoxia had seized, so she had him exiled. He departed in exile at Comana in 407."]
    ar: ["وُلد يوحنا ذهبي الفم في إنطاكية نحو سنة 347م وترهب واشتهر بعظاته وتفاسيره. صار بطريركًا للقسطنطينية، ودافع بشجاعة عن أرملة مسكينة اغتصبت الملكة اوذكسيا بستانها، فنفته، وتنيح في المنفى ببلدة كومانا سنة 407م.", null]
  "18":
    en: ["Atrasis was the daughter of the pagan King Hadrian. The virgin Yoana taught her about Christ, and she believed. When she refused to offer incense to the idols before her wedding, her father had both burned; they entered the fire hand in hand, praying.", "Philip was one of the Twelve Apostles. He preached in Africa and then in Hierapolis, turning many to God through wonders. Unbelievers there crucified him upside down, and he asked the faithful not to take him down, dying as a martyr in the year 80."]
    ar: ["فيلبس أحد الرسل الاثني عشر. بشر في أفريقية ثم في إيرابوليس ورد كثيرين إلى معرفة الله بالآيات. فصلبه غير المؤمنين منكسًا، وطلب من المؤمنين ألا ينزلوه ليكمل سعيه، فاستشهد سنة 80م.", "كانت ادروسيس ابنة الملك الوثني ادريانوس، فعلمتها العذراء يوانا طريق المسيح فآمنت. ولما رفضت أن تبخر للأوثان قبل زفافها، أمر أبوها بحرق الاثنتين، فدخلتا النار متماسكتي الأيدي تصليان، ووُجد جسداهما سالمين."]
  "19":
    en: ["This day remembers the consecration of the church of Saints Sergius and Bacchus in Rusafa. Believers hid Saint Sergius' body until the persecution ended; when it was brought into the church before fifteen bishops, oil flowed from it and healed many.", null]
    ar: ["تذكار تكريس كنيسة القديسين سرجيوس وواخس بمدينة الرصافة. أخفى المؤمنون جسد سرجيوس حتى انتهى الاضطهاد، ولما نُقل إلى الكنيسة في حضور خمسة عشر أسقفًا سال منه دهن شفى الذين أخذوه بإيمان.", null]
  "20":
    en: ["Anianus was a shoemaker in Alexandria. While mending Saint Mark's sandal he wounded his finger, and Mark healed him. He and his household believed, and Mark ordained him Patriarch of Alexandria in 64. He served 22 years and departed in 86.", "This day remembers the consecration of the churches of two saints: Prince Theodore, son of John El-Shotbe, and Prince Theodore El-Mishreke."]
    ar: ["كان إنيانوس إسكافيًا في الإسكندرية، وجرح إصبعه وهو يصلح حذاء القديس مرقس فشفاه الرسول. آمن هو وأهل بيته، ورسمه مرقس بطريركًا على الإسكندرية سنة 64م، فخدم اثنتين وعشرين سنة وتنيح سنة 86م.", "تذكار تكريس كنيستي القديسين الأمير ثاؤدورس بن يوحنا الشطبي والأمير ثاؤذورس المشرقي."]
  "21":
    en: ["On this day of every month the Church celebrates the Virgin Mary, the pure Mother of God the Word and mother of mercy, and asks for her intercession.", "Gregory, born to pagan parents in Neocaesarea, studied under Origen and was baptized in 239. He hid in the desert, but an angel sent him back to serve as bishop of his city. His many miracles earned him the name Wonder Worker.", "Cosma the Second, from Samanoud and a monk of Saint Macarius' monastery, became the 54th Pope. His time was full of trials, and icons were seen wet with tears. He kept strengthening the faithful for seven and a half years and departed in 859.", "This day remembers the martyrs Alphaeus, Zacchaeus, Romanus and John, and the saints Thomas, Victor and Isaac of the city of Ashmunen."]
    ar: ["وُلد غريغوريوس في قيصرية الجديدة من أبوين وثنيين، ودرس على العلامة أوريجانوس، واعتمد سنة 239م. هرب إلى البرية، لكن ملاك الرب أرسله ليقبل أسقفية بلده. صنع عجائب كثيرة فلُقّب بالعجائبي، وتنيح سنة 270م.", "وُلد البابا قسما الثاني بسمنود وترهب بدير القديس مقاريوس، ثم صار البابا الرابع والخمسين. لحقته وشعبه أحزان كثيرة حتى ظهرت الدموع على الأيقونات، لكنه ظل يعلم المؤمنين ويثبتهم، وتنيح سنة 859م بعد سبع سنين ونصف.", null, "تذكار الشهداء حلفا وزكا ورومانوس ويوحنا، وتذكار القديسين توما وبقطر وإسحق من الأشمونين.", "تعيد الكنيسة في هذا اليوم من كل شهر بتذكار السيدة العذراء مريم والدة الإله الكلمة، أم الرحمة، طالبة شفاعتها."]
  "22":
    en: ["Cosmas and Damian were doctors who treated the sick for free; their brothers became monks, and their widowed mother Theodote raised them in the fear of God. Under Diocletian all five suffered many tortures unharmed; their mother was beheaded first, then the brothers."]
    ar: ["كان قزمان ودميان طبيبين يعالجان المرضى بلا أجر، وترهب إخوتهما، وربتهم أمهم الأرملة ثاؤذوتي على خوف الله. في أيام دقلديانوس احتملوا عذابات كثيرة وحفظهم الرب، فقُطع رأس أمهم أولًا، ثم رؤوس الإخوة جميعًا."]
  "23":
    en: ["Cornelius was a centurion in Caesarea who sought the true God through fasting, prayer and almsgiving. An angel told him to send for Peter, who preached Christ to him, and he and his household were baptized. Peter later ordained him Bishop of Caesarea.", "This day remembers the great martyr Saint Marina and the consecration of her church in the city of Antioch."]
    ar: ["كان كرنيليوس قائد مئة في قيصرية فلسطين، وطلب الإله الحقيقي بالصوم والصلاة والصدقة. أمره ملاك أن يستدعي بطرس الرسول، فبشره بالمسيح واعتمد هو وأهل بيته، ثم رسمه بطرس أسقفًا على قيصرية.", "تذكار الشهيدة العظيمة القديسة مارينا، وتكريس كنيستها بمدينة إنطاكية."]
  "24":
    en: ["The Church honors the twenty-four incorporeal priests whom John saw in Revelation seated around God's throne, dressed in white with golden crowns. They offer the prayers of the saints like incense in golden bowls and intercede for mankind."]
    ar: ["تذكار الأربعة والعشرين قسيسًا غير المتجسدين الذين رآهم يوحنا في سفر الرؤيا جالسين حول العرش بثياب بيض وأكاليل ذهب. يقدمون صلوات القديسين كبخور في جامات ذهبية ويشفعون في البشر.", null, null, null]
  "25":
    en: ["Mercurius, born in Rome and named Philopater, was a brave soldier under Emperor Decius. An angel gave him a sword and he helped win a great battle. When he refused to offer incense to idols, he was beaten, sent in chains to Caesarea and beheaded."]
    ar: ["وُلد مرقوريوس في رومية باسم فيلوباتير، وكان جنديًا شجاعًا في أيام الملك داكيوس. أعطاه ملاك سيفًا فانتصر في الحرب، ولما رفض التبخير للأوثان ضُرب وأُرسل مقيدًا إلى قيصرية حيث قُطع رأسه."]
  "26":
    en: ["Valerian came to faith through his Christian wife Cecilia, and his brother Tiburcius believed too. Under Diocletian they buried the bodies of martyrs in Rome and were beheaded for refusing the idols. The official who judged them then believed and was martyred with Cecilia.", "Gregory was born in Cappadocia in 330 and was made Bishop of Nyssa by his brother Saint Basil in 372. He was exiled under Emperor Valens, returned in 378, wrote many religious books, and departed in 396."]
    ar: ["آمن بالاريانوس على يد زوجته المسيحية كيليكية، ثم آمن أخوه ثيبورينوس. في أيام دقلديانوس كانا يدفنان أجساد الشهداء في رومية، فقُطع رأساهما لرفضهما عبادة الأوثان، ثم آمن الحاجب طوسيوس واستشهد مع كيليكية.", "وُلد القديس غريغوريوس في كبدوكية سنة 330م، ورسمه أخوه القديس باسيليوس أسقفًا على نيسس سنة 372م. نُفي في عهد الملك والس ثم عاد سنة 378م، ووضع كتبًا دينية كثيرة، وتنيح سنة 396م.", null]
  "27":
    en: ["James was a high officer of the Persian king and gave up his faith to please him. A letter from his mother, wife and sister moved him to repent. He was cut apart limb by limb while praising God, and Christ appeared to comfort him."]
    ar: ["كان يعقوب من كبار رجال ملك الفرس، فمال عن الإيمان إرضاءً له، ثم رجع تائبًا بعد رسالة من أمه وزوجته وأخته. فأمر الملك بتقطيع أعضائه، وكان يسبح الله مع كل عضو، وظهر له المسيح وعزاه.", null]
  "28":
    en: ["Sarapamon, born Simon in Jerusalem of the tribe of Judah, was guided by the Virgin Mary to Alexandria, where Pope Theonas baptized him. He became Bishop of Niku and ended idol worship there, and under Diocletian he was beheaded near his own city."]
    ar: ["وُلد صرابامون في أورشليم باسم سمعان من سبط يهوذا، فأرشدته العذراء مريم إلى الإسكندرية حيث عمده البابا ثاؤنا. صار أسقفًا على نقيوس وأبطل عبادة الأوثان في كرسيه، ثم عُذّب في أيام دقلديانوس وقُطع رأسه عند بلده."]
  "29":
    en: ["Peter, the 17th Pope of Alexandria, excommunicated Arius. Arrested under Maximianus, he handed himself over secretly so his people would not riot, praying that his blood would end the shedding of Christian blood. So he is called the Seal of the Martyrs.", "Clement was a Roman nobleman who believed through Saint Peter and followed the apostles. He became Patriarch of Rome. Emperor Trajan exiled him, and he was thrown into the sea tied to an anchor around the year 100."]
    ar: ["البابا بطرس السابع عشر حرم أريوس من شركة الكنيسة. ولما قُبض عليه في أيام مكسيميانوس سلم نفسه سرًا حتى لا يحدث شغب، وصلى أن يكون دمه ختام سفك دماء المسيحيين، فلُقّب بخاتم الشهداء.", "كان أكليمنضس من عائلة شريفة في رومية، وآمن على يد القديس بطرس الرسول وتبعه. صار بطريركًا على رومية، فنفاه الملك ترايان، ثم رُبط عنقه بمرساة وأُلقي في البحر نحو سنة 100م.", null, null]
  "30":
    en: ["Acacius, a learned priest of Constantinople, refused to attend the Council of Chalcedon. As patriarch he wrote to Pope Peter of Alexandria confessing the faith of Cyril and Dioscorus and entered into communion with him. He was exiled for it and departed firm in the faith.", null, "This day remembers the consecration of the church of Saints Cosmas and Damian, their brothers Anthimus, Leontius and Euprepius, and their mother Theodote."]
    ar: ["كان أكاكيوس قسًا عالمًا بالكتب في القسطنطينية، ورفض حضور مجمع خلقيدونية. ولما صار بطريركًا راسل البابا بطرس بابا الإسكندرية معترفًا بإيمان كيرلس وديسقورس واشترك معه، فنُفي وتنيح ثابتًا على الإيمان.", null, "تذكار تكريس كنيسة القديسين قزمان ودميان وإخوتهما انسيموس ولاونديوس وابرابيوس وأمهم ثاؤذوتي.", null]
