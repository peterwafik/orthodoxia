month: 4
review: { status: draft, origin: ai-generated }
days:
  "1":
    en: ["St. Peter Elrahawy was born in Edessa and served at the court of King Theodosius, yet lived as an ascetic and later became a monk. He was made Bishop of Gaza against his will and kept strengthening the believers in the true faith during persecution.", null]
    ar: [null, "وُلد القديس بطرس الرهاوي في الرها، وخدم في بلاط الملك ثاؤدسيوس وهو يعيش حياة النسك، ثم ترهب. رُسم أسقفًا على غزة رغمًا عنه، وظل يثبّت المؤمنين على الإيمان المستقيم في زمن الاضطهاد.", null, null, null, null]
  "2":
    en: ["Abba Hor was a monk from Ebrahat near Ashmunein who loved solitude. In Alexandria he was falsely blamed for a child's death, but he prayed over the child, who came back to life. Fearing praise, he fled back to the desert."]
    ar: ["كان الأنبا اباهور راهبًا من ابرهت بالأشمونين أحب الوحدة. وفي الإسكندرية اتُّهم ظلمًا بموت طفل، فصلّى عليه ورشمه بالصليب فعادت إليه الحياة. وهرب بعدها من المجد الباطل إلى البرية.", null]
  "3":
    en: ["Saint Anne had no children and vowed to offer her child to God. When Mary was three years old, she was brought to the Temple in Jerusalem, where she lived for twelve years before being entrusted to Joseph the righteous."]
    ar: ["كانت القديسة حنة بلا نسل فنذرت أن تقدّم ثمرتها لله. ولما بلغت العذراء مريم ثلاث سنين قُدّمت إلى الهيكل بأورشليم، وأقامت فيه اثنتي عشرة سنة، ثم سُلّمت إلى يوسف البار ليرعاها.", null]
  "4":
    en: ["St. Andrew the Apostle, the brother of Peter, preached in Lydda and among the Kurds, and many believed through his teaching and miracles. Pagan priests beat him, then crucified and stoned him, and he received the crown of martyrdom."]
    ar: ["القديس إندراوس الرسول أخو بطرس، بشّر في مدينة اللد وبلاد الأكراد فآمن كثيرون بتعليمه وآياته. فقبض عليه كهنة الأوثان وضربوه، ثم صلبوه ورجموه، فنال إكليل الشهادة.", null, null]
  "5":
    en: ["Nahum, one of the twelve Minor Prophets, was born in Elkosh in Galilee. He rebuked Israel for worshipping idols and foretold the destruction of Nineveh and the good news of those who proclaim peace.", "St. Victor was a soldier from the Assiut region serving in the town of Shu. Refusing to worship idols under Diocletian, he was thrown into a bathhouse furnace in the village of Musha, yet his body was later found unburned.", null]
    ar: ["ناحوم النبي أحد الأنبياء الاثني عشر الصغار، وُلد في القوش بالجليل. وبّخ بني إسرائيل على عبادة الأوثان، وتنبأ بخراب نينوى وبالمبشرين بالسلام.", "كان القديس بقطر جنديًا من نواحي أسيوط يخدم في بلدة شو. رفض السجود للأصنام أيام دقلديانوس، فأُلقي في مستوقد حمام بقرية موشا، ووُجد جسده بعد ذلك سالمًا لم تحترق منه شعرة.", null]
  "6":
    en: ["Pope Abraam, the 62nd Pope of Alexandria, was a rich Syrian merchant who settled in Egypt. As Pope he gave all his money to the poor, forbade paying bribes for church ranks, and renewed many churches. He departed in 979 AD.", null]
    ar: ["البابا إبرام ابن زرعة هو البطريرك الثاني والستون، وكان تاجرًا سريانيًا غنيًا أقام في مصر. وزّع ماله على الفقراء، ومنع الرشوة في نيل درجات الكنيسة، وجدّد كنائس كثيرة. تنيح سنة 979م.", null]
  "7":
    en: ["St. Matthew the Poor, also called Matthew the Potter, was abbot of the monastery on the mountain of Aswan. God gave him the gift of healing the sick and casting out demons, and even wild animals were tame with him and ate from his hand."]
    ar: ["القديس متاؤس الفاخوري، ويُدعى متى المسكين، كان رئيسًا لدير جبل أسوان. منحه الله موهبة شفاء المرضى وإخراج الشياطين، حتى إن الوحوش كانت تأنس إليه وتأكل من يده.", null, null, null]
  "8":
    en: ["Pope Heraclas, the 13th Pope of Alexandria, was born to pagan parents who later became Christians. Pope Demetrius ordained him deacon and priest, and as Pope he taught and baptized many during thirteen years. He departed in 240 AD.", "St. Barbara was the daughter of a pagan nobleman named Dioscorus. Taught by Origen, she believed in Christ and honored the Holy Trinity. She and Juliana, a young woman who believed after seeing her suffering, were beheaded for their faith.", "St. Esi and his sister Thecla came from Abusir, west of Ashmunein. Esi was a rich man who gave to the poor and visited imprisoned Christians. Both confessed Christ before the governor, endured harsh tortures, and were beheaded.", "St. Samuel was a monk of Scetis who tore up the Tome of Leo, refusing any change to the true faith, and lost an eye from the blows he received. An angel sent him to El-Qalamoun, where he built a monastery and many monks gathered around him."]
    ar: ["كان القديس إيسي وأخته تكلا من أبوصير غرب الأشمونين، وكان إيسي غنيًا يتصدق على المساكين ويفتقد المسجونين من أجل الإيمان. اعترفا بالمسيح أمام الوالي واحتملا عذابات شديدة، ثم قُطعت رأساهما.", "كانت القديسة بربارة ابنة رجل وثني عظيم اسمه ديسقورس. تعلّمت الإيمان من العلامة أوريجانوس، وأكرمت الثالوث القدوس فغضب أبوها وأسلمها للوالي. وآمنت يوليانة لما رأت صبرها، فقُطعت رأساهما معًا.", "كان الأنبا صموئيل راهبًا في برية شيهيت، ومزّق طومس لاوون غيرةً على الإيمان المستقيم، فضُرب حتى فقد إحدى عينيه. وأرشده ملاك إلى القلمون فبنى هناك ديرًا اجتمع حوله فيه رهبان كثيرون.", "البابا ياروكلاس هو البطريرك الثالث عشر، وُلد لأبوين وثنيين آمنا بعد ولادته. رسمه البابا ديمتريوس شماسًا ثم قسًا، وصار بطريركًا فعلّم وعمّد كثيرين مدة ثلاث عشرة سنة. تنيح سنة 240م."]
  "9":
    en: ["St. Poemin from Minyat Bani Khasib left his work to become a monk. He confessed Christ in Ansina and was tortured, but the Lord kept him alive until Constantine ended the persecution. He later lived near Ashmunein and was given the gift of healing."]
    ar: ["القديس بيمن من منية بني خصيب، ترك عمله وترهب. اعترف بالمسيح في أنصنا فعُذّب كثيرًا، وكان الرب يقيمه سالمًا حتى أنهى الملك قسطنطين الاضطهاد. وسكن بعدها ديرًا قرب الأشمونين ونال موهبة الشفاء."]
  "10":
    en: ["St. Severus, Patriarch of Antioch, departed in Sakha at the home of a faithful man named Dorotheus. His body was carried by boat to the Zogag Monastery west of Alexandria, and as a sign God made the boat travel through very shallow water.", "St. Nicholas, Bishop of Myra, was born to parents who had long been childless. He secretly threw bags of money through a poor man's window so the man's daughters could marry. He took part in the Council of Nicaea in 325 AD."]
    ar: ["وُلد القديس نيقولاوس في مورا لأبوين ظلا طويلًا بلا ولد، ثم صار أسقفًا عليها. ألقى سرًّا أكياس مال من نافذة رجل فقير لكي يزوّج بناته، وحضر مجمع نيقية سنة 325م.", null, "تنيح القديس ساويرس بطريرك إنطاكية في سخا عند أرخن محب اسمه دوروثاؤس، فنُقل جسده في سفينة إلى دير الزجاج غرب الإسكندرية. وأظهر الله آية إذ سارت السفينة في ماء قليل حتى بلغت الساحل."]
  "11":
    en: ["St. Pijimi was from Fisha. At twelve, while shepherding his father's sheep, an angel led him to the desert of Scetis to become a monk. He lived a life of long fasts and constant prayer, and the Lord used him to bring a straying people back to the faith."]
    ar: ["الأنبا بيجمي من فيشا، ظهر له ملاك وهو في الثانية عشرة يرعى غنم أبيه، وقاده إلى برية شيهيت فترهب. عاش في أصوام طويلة وصلاة دائمة، واستخدمه الرب ليردّ قومًا ضالين إلى الإيمان.", null, null, null, null]
  "12":
    en: ["Each month on this day the Church remembers the honorable Archangel Michael, chief of the heavenly hosts, who intercedes for mankind.", "St. Hedra refused marriage at eighteen and, after walking in a funeral, felt he had died to the world and joined a monastery as a disciple of St. Poemin. He later lived as a hermit until Pope Theophilus ordained him Bishop of Aswan.", null, "In 249 AD a council of sixty bishops met in Rome under Pope Cornelius against the priest Novatus, who taught that those who fell in persecution or in grave sin could never be accepted back. The council taught that repentance is open to all and excommunicated him."]
    ar: ["تحتفل الكنيسة في هذا اليوم من كل شهر بتذكار رئيس جند السماء الملاك الجليل ميخائيل، الشفيع في جنس البشر.", "رفض القديس هدرا الزواج وهو في الثامنة عشرة، ولما سار في جنازة شعر أنه مات عن العالم فالتحق بالدير وتتلمذ للقديس بيمن. ثم توحّد في مغارة، إلى أن رسمه البابا ثاؤفيلس أسقفًا على أسوان.", null, "اجتمع في رومية سنة 249م مجمع من ستين أسقفًا أيام البابا قرنيليوس، لمحاكمة نوباطس القس الذي قال إن من أنكر الإيمان أو سقط في الزنا لا تُقبل توبته. فأوضح الآباء أن باب التوبة مفتوح للجميع وحرموه.", null]
  "13":
    en: ["St. Barsanuphius was a monk living at the church of Abu Mina at the beginning of the Islamic era, known for long fasts and many prayers. Wicked people falsely accused him of insulting the judges, and he was tortured and beheaded.", "St. Abracius from Upper Egypt became a monk at twenty. When the devil told him he still had fifty years to live, hoping he would grow lazy, he answered that he must struggle even harder. He departed that same year after seventy years of monastic life.", "St. Misael became a monk under Abba Isaac, abbot of the Qalamoun monastery, and lived in strict prayer until desert anchorites took him with them. He asked that his father's money be used to build a church in his name, and he came with the anchorites to its consecration."]
    ar: ["كان القديس برشنوفيوس راهبًا مقيمًا في كنيسة أبي مينا في أول عصر الإسلام، وعُرف بالصوم والمطانيات والصلوات الكثيرة. وشى به أشرار أنه سبّ القضاة، فعُذّب ثم قُطعت رأسه.", null, "ترهب القديس ابراكيوس، وهو من الصعيد، في سن العشرين. ولما قال له الشيطان إن أمامه خمسين سنة أخرى ليوقعه في التواني، أجاب بأنه يجب أن يجاهد أكثر. وتنيح في تلك السنة بعد سبعين سنة من النسك.", "ترهب القديس ميصائيل عند الأنبا إسحق رئيس دير القلمون وعاش في نسك وصلاة، ثم أخذه الآباء السواح معهم. وطلب أن يُبنى بمال أبيه كنيسة على اسمه، فحضر مع السواح صلاة تكريسها.", null]
  "14":
    en: ["Behnam and his sister Sarah were children of the Persian king Sennacherib. Through the prayers of St. Matthew the Poor, Sarah was healed and baptized. When both refused to worship the stars, their father had them killed; later he believed and built a monastery for their bodies.", "St. Christodoulos was a goldsmith from Ain Shams. Tempted by a woman, he fled the world, placed his mother in a convent, gave his money to the poor, and went to the desert. He lived there for many years and defeated the devil with the sign of the cross.", "St. Simeon of Upper Menouf was martyred in the days of the Arabs. On the same day the Church remembers the martyrdom of Saints Abba Hor and Abba Mina.", "Abba Ammonius was ordained Bishop of Esna by Pope Peter and spent his weeks praying in a cave, coming down to serve his people. In the persecution of Arianus many of his flock were martyred, and he himself was burned, yet his body was found unharmed."]
    ar: ["القديسان بهنام وسارة أخته من أولاد سنحاريب ملك الفرس. شفى الرب سارة من مرض عضال بصلاة القديس متى المسكين فاعتمدت. ورفضا العودة إلى عبادة الكواكب فقتلهما أبوهما، ثم آمن بعد ذلك وبنى ديرًا وضع فيه جسديهما.", "رسم البابا بطرس الأنبا أمونيوس أسقفًا على إسنا، وكان يقضي الأسبوع في مغارة ثم ينزل لخدمة شعبه. وفي اضطهاد إريانوس استشهد كثيرون من شعبه، ثم أُحرق هو أيضًا، ووُجد جسده سالمًا لم تمسه النار.", "استشهد القديس سمعان من منوف العليا في أيام العرب، وتُذكر في هذا اليوم أيضًا شهادة القديسين أباهور وأبامينا.", null, "كان القديس خرستوذولوس السائح من عين شمس. ولما جاءته امرأة تحاول أن تغويه، هرب من العالم، وأدخل أمه ديرًا للراهبات، ووزّع ماله على المساكين ومضى إلى البرية. وعاش هناك سنين طويلة يغلب الشيطان بعلامة الصليب."]
  "15":
    en: ["St. Gregory, Patriarch of the Armenians, was tortured by King Tiridates for refusing to worship idols and thrown into a pit, where he lived for fifteen years. After his release he healed the king, who believed with all his land, and Gregory baptized them and built many churches."]
    ar: ["عذّب تريداته ملك الأرمن القديس غريغوريوس لرفضه عبادة الأوثان، وطرحه في جب أقام فيه خمس عشرة سنة. ولما أُخرج شفى الملك، فآمن هو وكل شعبه، فعمّدهم وبنى لهم كنائس كثيرة ورسم لهم أساقفة وكهنة.", null, null]
  "16":
    en: ["Gideon, from the tribe of Manasseh, was one of the Judges of Israel. The angel of the Lord called him to save Israel from the Midianites; God gave him the sign of the fleece, and with only three hundred men he defeated the enemy.", null, null]
    ar: [null, "جدعون البار من سبط منسى، وكان أحد قضاة بني إسرائيل. دعاه ملاك الرب ليخلّص شعبه من المديانيين، فأعطاه الله علامة جزة الصوف، وانتصر على أعدائه بثلاثمئة رجل فقط.", null, null, null]
  "17":
    en: ["St. Luke was born in Persia to Christian parents and became an officer over a hundred soldiers before leaving the world to become a monk. He lived forty-five years on a pillar-like rock near Constantinople, healing the sick, and after his departure his body was carried to Constantinople."]
    ar: ["وُلد القديس لوقا العمودي في بلاد الفرس لأبوين مسيحيين، وصار قائدًا على مئة جندي ثم ترك العالم وترهب. أقام خمسًا وأربعين سنة على صخرة كالعمود قرب القسطنطينية يشفي المرضى، وبعد نياحته نُقل جسده إليها.", null, null]
  "18":
    en: ["St. Titus, the disciple of St. Paul, was Bishop of Crete. Emperor Constantine had his body brought from Crete to Constantinople and placed in a church built for him, and God worked miracles through his relics, such as healing a man's broken foot.", null]
    ar: ["القديس تيطس الرسول تلميذ بولس الرسول وأسقف كريت. أمر الملك قسطنطين بنقل جسده من كريت إلى القسطنطينية ووضعه في هيكل بُني له، وأظهر الله من جسده آيات كثيرة، منها شفاء رجل انكسرت قدمه.", null]
  "19":
    en: ["St. John came from a priestly family and used his inheritance to build a guest house where he served the sick himself. He became a monk in Scetis under St. Daniel, then Bishop of El-Borollos, where he fought false teachings and brought many back to the true faith."]
    ar: [null, "كان القديس يوحنا من نسل الكهنة، وبنى بميراثه بيتًا للغرباء يخدم فيه المرضى بنفسه. ثم ترهب في برية شيهيت عند القديس دانيال، وصار أسقفًا على البرلس، فحارب البدع وردّ كثيرين إلى الإيمان المستقيم."]
  "20":
    en: ["Haggai, one of the twelve Minor Prophets, was from the priestly tribe of Levi and was born in Babylon during the exile. He returned to Jerusalem with Zerubbabel and urged the people to finish rebuilding God's Temple instead of decorating their own houses."]
    ar: ["حجي النبي أحد الأنبياء الاثني عشر الصغار، من نسل هارون الكاهن، وُلد في بابل أثناء السبي. عاد إلى أورشليم مع زربابل، وحثّ الشعب على إكمال بناء بيت الله بدل الاهتمام ببيوتهم المزينة.", null, null]
  "21":
    en: ["Each month on this day the Church honors the pure Virgin Mary, Mother of God the Word and mother of mercy, and asks for her intercession.", "St. Barnabas, one of the Seventy Apostles, was a Levite whose family lived in Cyprus. He brought St. Paul to the apostles and preached with him in many lands. While preaching in Cyprus with St. Mark, he was stoned and burned, receiving the crown of martyrdom."]
    ar: ["تعيّد الكنيسة في هذا اليوم من كل شهر بتذكار السيدة العذراء مريم والدة الإله الكلمة وأم الرحمة، طالبةً شفاعتها.", "القديس برنابا أحد السبعين رسولًا، من سبط لاوي وأسرته مقيمة في قبرص. قدّم بولس الرسول إلى الرسل وبشّر معه في بلاد كثيرة. ولما كرز في قبرص مع القديس مرقس رجمه اليهود وأحرقوا جسده، فنال إكليل الشهادة.", null]
  "22":
    en: ["The Church remembers Archangel Gabriel, who brought the good news of Christ's birth to the Virgin Mary and of John the Baptist's birth to Zechariah, together with the consecration of his church in Caesarea.", "Pope Anastasius, the 36th Pope of Alexandria, was a priest of Alexandria who built churches and brought many back to the Orthodox faith. He renewed unity with the Church of Antioch and wrote one book every year, twelve in all. He departed in 611 AD."]
    ar: ["تذكار رئيس الملائكة غبريال المبشر وتكريس كنيسته في قيسارية. هو الذي بشّر العذراء مريم بميلاد المسيح، وبشّر زكريا بميلاد يوحنا المعمدان.", null, "البابا أنسطاسيوس هو البطريرك السادس والثلاثون، وكان قسًا بالإسكندرية. شيّد كنائس وردّ كثيرين إلى الإيمان الأرثوذكسي، وجدّد الاتحاد مع كنيسة إنطاكية، وكتب كل سنة كتابًا حتى بلغت اثني عشر كتابًا. تنيح سنة 611م."]
  "23":
    en: ["David son of Jesse, from Bethlehem of the tribe of Judah, was anointed king by Samuel because God looks at the heart. He spared King Saul's life more than once and defeated Goliath with a stone from his sling. He lived seventy years.", "St. Timothy became a monk and lived alone near his monastery. When the devil tried to trap him through a woman, he remembered the hour of death and fled. He lived thirty years by a spring and a palm tree, and even wild animals were tame with him."]
    ar: ["داود بن يسى من بيت لحم من سبط يهوذا، مسحه صموئيل النبي ملكًا لأن الرب ينظر إلى القلب. أبقى على حياة شاول مرات عديدة، وغلب جليات بحجر من مقلاعه. وعاش سبعين سنة.", "ترهب القديس تيموثاوس وانفرد في قلاية قرب الدير. ولما حاول الشيطان إسقاطه بواسطة امرأة، تذكّر ساعة الموت وهرب. وعاش ثلاثين سنة بجوار عين ماء ونخلة، حتى إن الوحوش كانت تأنس به.", null]
  "24":
    en: ["St. Ignatius was a disciple of St. John the Evangelist, who made him Patriarch of Antioch. He brought many pagans to faith and baptized them. The pagans tortured him harshly, and when he would not deny his faith they threw him to wild beasts.", "St. Philogonus was married and had a daughter; after his wife died he became a monk. Chosen Patriarch of Antioch, he protected his flock from the Arians and other heresies and lived simply, owning nothing extra. St. John Chrysostom praised him.", "The Church remembers the birth of the great St. Takla Haymanot the Ethiopian. His departure is commemorated on the 24th of Mesra."]
    ar: ["كان القديس أغناطيوس تلميذًا للقديس يوحنا الإنجيلي الذي أقامه بطريركًا على إنطاكية. ردّ كثيرين من الوثنيين إلى الإيمان وعمّدهم، فعذّبه الوثنيون عذابًا شديدًا، ولما ثبت على إيمانه طرحوه للوحوش.", "تذكار ميلاد القديس العظيم تكلاهيمانوت الحبشي، أما تذكار نياحته ففي 24 مسرى.", "كان القديس فيلوغونيوس متزوجًا ورُزق ابنة، ولما توفيت زوجته ترهب. اختير بطريركًا على إنطاكية فحرس رعيته من الأريوسيين وغيرهم من المبتدعين، وعاش زاهدًا لا يقتني شيئًا زائدًا، وقد مدحه القديس يوحنا ذهبي الفم."]
  "25":
    en: ["St. John Kama was from Shubra Mantu near Sa. Married against his will, he and his wife agreed to keep their virginity, and she later became abbess of a convent. He became a monk in Scetis at the monastery of St. Macarius, and many monks gathered around him."]
    ar: ["القديس يوحنا كاما من شبرامنتو من أعمال صا. زوّجه أبواه بغير إرادته فاتفق مع زوجته على حفظ بتوليتهما، وصارت هي رئيسة لدير العذارى. وترهب هو في برية شيهيت بدير القديس مقاريوس، واجتمع حوله رهبان كثيرون.", null]
  "26":
    en: ["St. Anastasia was born in Rome in 275 AD to a pagan father and a Christian mother. She served Christians imprisoned for their faith and, after her husband died, gave her money to the poor. She was tortured for her faith and martyred in 304 AD.", null]
    ar: ["وُلدت القديسة أنسطاسية في رومية سنة 275م لأب وثني وأم مسيحية. كانت تخدم المسجونين من أجل الإيمان، ولما مات زوجها وزّعت مالها على المساكين. عُذّبت كثيرًا ونالت إكليل الشهادة سنة 304م.", null, null]
  "27":
    en: ["St. Bisadi, Bishop of Absay, strengthened Christians in the faith under Diocletian. Before being taken away, he prayed a last liturgy with his people and urged them to stand firm. After tortures in which the Lord kept him unharmed, he was beheaded."]
    ar: ["كان الأنبا بسادي أسقف ابصاي يثبّت المسيحيين على الإيمان أيام دقلديانوس. وقبل أن يُؤخذ أقام القداس الإلهي لشعبه وأوصاهم بالثبات، ثم عُذّب وكان الرب يحفظه سالمًا، وأخيرًا قُطعت رأسه."]
  "28":
    en: ["150 men and 24 women from Ansena who worshipped idols saw St. Paul the Syrian's eyes healed after he had been blinded with hot nails. They believed in his God, confessed Christ before the governor, and were beheaded."]
    ar: [null, "كان مئة وخمسون رجلًا وأربع وعشرون امرأة من أهل أنصنا يعبدون الأصنام، فرأوا عيني القديس بولس السرياني وقد عادتا سليمتين بعد أن أعماه الوالي بمسامير محمّاة. فآمنوا بإلهه واعترفوا بالمسيح، فقُطعت رؤوسهم."]
  "29":
    en: ["The Church celebrates the birth of our Lord Jesus Christ from the Virgin Mary in Bethlehem. Angels announced the joyful news to the shepherds, who came and worshipped the Child, and the words of the prophets were fulfilled."]
    ar: ["تعيّد الكنيسة بميلاد ربنا يسوع المسيح من العذراء مريم في بيت لحم. بشّر الملاك الرعاة بالفرح العظيم، فجاءوا وسجدوا للطفل، وتمّت بذلك نبوات الأنبياء.", null, null]
  "30":
    en: ["St. John was hegumen of the Monastery of St. Macarius in Scetis and a spiritual father to many saints. He taught that the holy sacrament is the same whether the priest is a sinner or righteous. Barbarians took him captive for years, and he lived ninety years."]
    ar: [null, null, null, "كان الأنبا يوأنس قمصًا لدير القديس مقاريوس ببرية شيهيت، وصار أبًا لكثير من القديسين. علّم أن السر المقدس واحد سواء كان الكاهن خاطئًا أو بارًا، وسباه البربر سنين عديدة، وعاش تسعين سنة."]
