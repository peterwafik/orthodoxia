title:
  en: "A sign: Immanuel"
  ar: "آية: عمانوئيل"
hook:
  en: Jerusalem is under threat and its king is terrified. God offers him any sign he likes. He refuses. So God gives a sign anyway, one that would be remembered for ever.
  ar: أورشليم مهددة وملكها مرتعب. يعرض الله عليه أي آية يريدها، فيرفض. فيعطي الله آية رغم ذلك، آية ستُذكر إلى الأبد.
explain:
  en: "“Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel.” Immanuel means “God with us”. Matthew quotes this verse about the birth of Christ from the Virgin Mary. Christmas is not God sending help from far away: it is God coming to be with us."
  ar: «ها العذراء تحبل وتلد ابنًا وتدعو اسمه عمانوئيل». ومعنى عمانوئيل «الله معنا». ويقتبس متى هذه الآية عن ميلاد المسيح من العذراء مريم. الميلاد ليس أن الله يرسل معونة من بعيد، بل أن الله يأتي ليكون معنا.
think:
  en: “God with us.” Where do you most need to know that God is with you this week?
  ar: «الله معنا». أين تحتاج أكثر أن تعرف أن الله معك هذا الأسبوع؟
