hook:
  en: "After forty chapters of warnings, Isaiah’s tone changes completely. The first words are tender: “Comfort ye, comfort ye my people.” Someone is coming, and a road must be made ready."
  ar: "بعد أربعين أصحاحًا من الإنذارات، تتغير نبرة إشعياء تمامًا. والكلمات الأولى رقيقة: «عزّوا عزّوا شعبي». أحد ما آتٍ، ولا بد من إعداد الطريق."
explain:
  en: "A voice cries, “Prepare ye the way of the Lord.” The Gospels hear in it John the Baptist, who prepared the way for Christ. Then the picture of God himself: a shepherd who gathers the lambs in his arms. That is who is coming at Christmas."
  ar: "صوت صارخ: «أعدّوا طريق الرب». وتسمع الأناجيل فيه يوحنا المعمدان الذي أعدّ الطريق للمسيح. ثم صورة الله نفسه: راعٍ يجمع الحملان بذراعه. هذا هو الآتي في الميلاد."
