hook:
  en: "A father and son climb a mountain. The son carries the wood. He asks the question that hangs over the whole Old Testament: “where is the lamb?”"
  ar: "أب وابنه يصعدان جبلًا. الابن يحمل الحطب. ويسأل السؤال الذي يخيّم على العهد القديم كله: «أين الخروف؟»"
explain:
  en: "Isaac carrying the wood up the mountain has always reminded Christians of Christ carrying his cross. Abraham answers, “God will provide himself a lamb.” Centuries later John the Baptist points at Jesus: “Behold the Lamb of God.” Christmas is God providing the Lamb."
  ar: "إسحاق حاملًا الحطب على الجبل ذكّر المسيحيين دائمًا بالمسيح حاملًا صليبه. ويجيب إبراهيم: «الله يرى له الخروف». وبعد قرون يشير يوحنا المعمدان إلى يسوع: «هوذا حمل الله». الميلاد هو أن الله يقدّم الحمل."
