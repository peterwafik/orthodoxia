title:
  en: A blessing for every family
  ar: بركة لكل العائلات
hook:
  en: "God asks a 75-year-old man to leave home for a country he has never seen. The promise that comes with it is bigger than one family: “in thee shall all families of the earth be blessed.”"
  ar: "يطلب الله من رجل في الخامسة والسبعين أن يترك بيته إلى أرض لم يرها قط. والوعد الذي معه أكبر من عائلة واحدة: «وتتبارك فيك جميع قبائل الأرض»."
explain:
  en: "Abraham’s family will carry a blessing meant for the whole world. Matthew begins his account of Christ’s birth with exactly this name: “Jesus Christ, the son of David, the son of Abraham.” The promise travels through the generations to Bethlehem."
  ar: "ستحمل عائلة إبراهيم بركة موجهة إلى العالم كله. ويبدأ متى روايته عن ميلاد المسيح بهذا الاسم تمامًا: «يسوع المسيح ابن داود ابن إبراهيم». والوعد يسافر عبر الأجيال حتى بيت لحم."
think:
  en: Abraham went “not knowing whither he went”. What step might God be asking you to take without seeing the whole road?
  ar: خرج إبراهيم «وهو لا يعلم إلى أين يأتي». ما الخطوة التي قد يطلبها الله منك دون أن ترى الطريق كله؟
