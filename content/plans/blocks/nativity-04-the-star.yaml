hook:
  en: "A foreign fortune-teller is paid to curse Israel. Every time he opens his mouth, a blessing comes out instead, and then a vision: a star rising, a ruler coming."
  ar: "عرّاف غريب يُستأجر ليلعن إسرائيل. وكلما فتح فمه خرجت بركة بدل اللعنة، ثم رؤيا: كوكب يطلع، وملك يأتي."
explain:
  en: "Balaam was not even an Israelite, yet God put this prophecy in his mouth: “there shall come a Star out of Jacob, and a Sceptre shall rise out of Israel.” At Christ’s birth, wise men from the East followed a star to find the King."
  ar: "لم يكن بلعام إسرائيليًا، ومع ذلك وضع الله هذه النبوة في فمه: «يبرز كوكب من يعقوب ويقوم قضيب من إسرائيل». وعند ميلاد المسيح تبع مجوس من المشرق نجمًا ليجدوا الملك."
