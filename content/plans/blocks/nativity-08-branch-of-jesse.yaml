title:
  en: A shoot from a stump
  ar: قضيب من جذع
hook:
  en: "Picture a tree cut down to a stump: that was David’s royal family after the exile. Isaiah sees a green shoot growing out of the dead wood."
  ar: "تخيّل شجرة قُطعت حتى صارت جذعًا: هكذا كان بيت داود الملكي بعد السبي. ويرى إشعياء قضيبًا أخضر ينبت من الخشب الميت."
explain:
  en: Jesse was David’s father. The shoot is a King on whom “the spirit of the Lord shall rest”. He judges the poor fairly, and in his kingdom the wolf lives with the lamb. When all hope seemed gone, God kept his promise to David.
  ar: كان يسى أبا داود. والقضيب ملك «يحلّ عليه روح الرب». يقضي للمساكين بالعدل، وفي ملكوته يسكن الذئب مع الخروف. وحين بدا أن كل رجاء قد ضاع، حفظ الله وعده لداود.
think:
  en: Is there a “stump” in your life, something that looks finished? What would a new shoot there look like?
  ar: هل في حياتك «جذع»، شيء يبدو أنه انتهى؟ كيف يبدو قضيب جديد ينبت منه؟
