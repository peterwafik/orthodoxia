title:
  en: The greatest commandment, and two small coins
  ar: الوصية العظمى، وفلسان صغيران
hook:
  en: "Experts line up to trap Jesus with trick questions. One honest scribe asks a real one: which commandment matters most? Then Jesus points at a poor widow putting two tiny coins in the box."
  ar: "يصطف الخبراء ليوقعوا يسوع بأسئلة ماكرة. ويسأل كاتب صادق سؤالًا حقيقيًا: أي وصية هي الأهم؟ ثم يشير يسوع إلى أرملة فقيرة تلقي فلسين صغيرين في الخزانة."
explain:
  en: "Jesus joins two verses from the Law: love God with all your heart, soul, mind and strength (Deuteronomy 6:5), and love your neighbour as yourself (Leviticus 19:18). The widow shows what “all” means: she gave everything she had."
  ar: "يجمع يسوع بين آيتين من الناموس: تحب الرب إلهك من كل قلبك ونفسك وفكرك وقدرتك (التثنية ٦: ٥)، وتحب قريبك كنفسك (اللاويين ١٩: ١٨). وتُظهر الأرملة معنى «كل»: أعطت كل ما عندها."
think:
  en: "Which is harder for you this week: loving God with all, or loving the person next to you?"
  ar: "أيهما أصعب عليك هذا الأسبوع: أن تحب الله بكل شيء، أم أن تحب من بجانبك؟"
check:
  question:
    en: How much did the widow give?
    ar: كم أعطت الأرملة؟
  options:
    - en: A tenth of her money
      ar: عُشر مالها
