title:
  en: Supper and the garden
  ar: العشاء والبستان
hook:
  en: At the Passover meal Jesus takes bread and says, “This is my body.” Hours later, in a garden called Gethsemane, he falls to the ground and prays while his friends fall asleep.
  ar: "في عشاء الفصح يأخذ يسوع خبزًا ويقول: «هذا هو جسدي». وبعد ساعات، في بستان اسمه جثسيماني، يخرّ على الأرض ويصلي بينما ينام أصدقاؤه."
explain:
  en: "Passover remembered God freeing Israel from Egypt. Jesus gives it a new centre: his body and his blood of the new covenant. The Church does what he did here at every Holy Mass. In the garden he calls God “Abba”, Father, and chooses the Father’s will."
  ar: "كان الفصح تذكارًا لتحرير الله لإسرائيل من مصر. ويعطيه يسوع مركزًا جديدًا: جسده ودمه للعهد الجديد. وتصنع الكنيسة ما صنعه هنا في كل قداس. وفي البستان يدعو الله «أبا»، أي الآب، ويختار مشيئة الآب."
think:
  en: “Not what I will, but what thou wilt.” Is there something where you need to pray that?
  ar: «ليكن لا ما أريد أنا بل ما تريد أنت». هل هناك أمر تحتاج أن تصلي فيه هكذا؟
check:
  question:
    en: What did the disciples do while Jesus prayed?
    ar: ماذا فعل التلاميذ بينما كان يسوع يصلي؟
  options:
    - en: They prayed with him
      ar: صلّوا معه
    - en: They slept
      ar: ناموا
    - en: They went home
      ar: رجعوا إلى بيوتهم
  answer: 1
  why:
