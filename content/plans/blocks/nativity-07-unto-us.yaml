title:
  en: “Unto us a child is born”
  ar: «لأنه يولد لنا ولد»
hook:
  en: People walking in darkness see a great light. The reason? Not an army, not a hero, but a baby. And his names are names no ordinary baby could carry.
  ar: شعب سالك في الظلمة يرى نورًا عظيمًا. والسبب؟ ليس جيشًا ولا بطلًا، بل طفل. وأسماؤه أسماء لا يستطيع طفل عادي أن يحملها.
explain:
  en: "“Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace.” Isaiah calls the child “mighty God”. The Church sees here the mystery of Christmas: the child born in Bethlehem is God the Word made man, without ceasing to be God."
  ar: "«عجيبًا مشيرًا إلهًا قديرًا أبًا أبديًا رئيس السلام». يدعو إشعياء الطفل «إلهًا قديرًا». وترى الكنيسة هنا سر الميلاد: الطفل المولود في بيت لحم هو الله الكلمة المتجسد، دون أن يكف عن أن يكون الله."
