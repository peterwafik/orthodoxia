notes: >-
  Used only for the chapters of the Arabic Bible that the St. Mark Church commentary does not cover
  (402 chapters). Text taken from his chapter pages on St-Takla.org (pages listed with SHA-256 in
  data/commentary/malaty/sources.json), divided by the verse anchors of each page, shown unmodified
  except that the site's navigation, image captions, printed page numbers and footnote markers are
  left out; appendices after a chapter's closing meditation are left on the original page. Every
  entry is credited and links to his page. Not on St-Takla.org, so still without commentary: Baruch,
  1–2 Maccabees, the Greek additions to Esther (11–16), Susanna, and Bel and the Dragon. Translated
  into English by machine, unreviewed (content/commentary/malaty-en). No commercial use.
