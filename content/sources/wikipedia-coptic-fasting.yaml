notes: >-
  Used only for the dates of the fasts in the reading plans' Church Year: the Nativity fast from 16 Hathor (25 November)
  to the Nativity on 29 Koiak (7 January), 40 days plus 3 added days, 43 in all; Great Lent of 55 days ending at Pascha;
  the three-day Fast of Nineveh before Great Lent. The article cites N. Farag, The Coptic Christian Heritage (Routledge,
  2013), M. Johnson and S. Alexopoulos, Introduction to Eastern Christian Liturgies, O. Meinardus, Christians in Egypt
  (OUP, 2006). To be replaced by the Coptic Encyclopedia entry or a Coptic Church publication when one can be read.
notesAr: >-
  يُستخدم لتواريخ الأصوام فقط في خطة السنة الكنسية: صوم الميلاد من ١٦ هاتور (٢٥ نوفمبر) حتى عيد الميلاد في ٢٩ كيهك
  (٧ يناير)، أربعون يومًا وثلاثة أيام مضافة، ثلاثة وأربعون في المجموع؛ والصوم الكبير خمسة وخمسون يومًا ينتهي بالفصح؛ وصوم
  نينوى ثلاثة أيام قبل الصوم الكبير. يُستبدل بمدخل الموسوعة القبطية أو بمنشور كنسي قبطي متى أمكن الاطلاع عليه.
