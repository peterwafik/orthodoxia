notes: >-
  Arabic only. 52 PDFs pinned by SHA-256 in data/commentary/stmark/sources.json, covering all 27 New
  Testament books, 23 Old Testament books, Tobit and Judith. Text is extracted from the PDFs
  (scripts/commentary). The Matthew, Mark, Luke and John PDFs use fonts that scramble some letter
  pairs; their text is repaired automatically and marked as such. The Job and Esther PDFs have no
  text layer, so the site links to them. The text is shown unmodified apart from extraction repairs,
  and is never translated or summarized without review. The church's own page links RomansFull-Ar.pdf
  and JohnThirdFull-Ar.pdf, which return 404; the files are at the -AR names.
notesAr: "بالعربية فقط. 52 ملف PDF مثبّتة ببصماتها الرقمية، تغطي أسفار العهد الجديد السبعة والعشرين و23 سفرًا من العهد القديم وطوبيا ويهوديت. النص مستخرج من الملفات. ملفات متى ومرقس ولوقا ويوحنا تستخدم خطوطًا تبعثر بعض أزواج الحروف، فيُصلَح نصها آليًا ويُعلَّم بذلك. ملفا أيوب وأستير بلا طبقة نصية، فيربط الموقع بهما. يُعرض النص دون تعديل سوى إصلاحات الاستخراج، ولا يُترجم ولا يُلخَّص أبدًا دون مراجعة. تربط صفحة الكنيسة نفسها بملفين لا يعملان، والملفان موجودان باسم آخر."
