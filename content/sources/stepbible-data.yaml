notes: TIPNR supplies every man and woman the Bible names, with family links, period and verses, for the Bible history chart (/bible-history); the dates, summaries and Arabic names there are the project's own. TAHOT, TAGNT and TVTMS are planned (TVTMS is the candidate versification mapping for KJV, LXX and Arabic). The README asks that changes to the data be recorded and made available.
notesAr: "تقدّم بيانات «تِبْنَر» كل رجل وامرأة يذكرهم الكتاب المقدس، مع روابط العائلة والعصر والآيات، لمخطط تاريخ الكتاب المقدس؛ أما التواريخ والملخصات والأسماء العربية فيه فمن عمل المشروع. وبقية البيانات مخطط لها (وجدول TVTMS هو المرشّح لمطابقة ترقيم الآيات). ويطلب ملف التعريف أن تُدوَّن أي تغييرات في البيانات وأن تُتاح."
