attribution: "People of the Bible chart: names, families and verses from TIPNR (Translators Individualised Proper Names with all References), STEP Bible (www.STEPBible.org), Tyndale House Cambridge, CC BY 4.0. Modified: reduced to men and women, Septuagint-only references dropped, verse lists shortened; changes are listed in scripts/bible-people/build.ts."
