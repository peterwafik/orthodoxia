notesAr: >-
  مراجع قراءات القطمارس اليومية (data/katameros) وقواعد اختيار قراءات كل يوم، تستخدمها صفحة القداس لعرض البولس
  والكاثوليكون والإبركسيس والمزمور والإنجيل لكل يوم كاملة من نسخ الكتاب المقدس في الموقع. صُحح مرجع مزمور واحد من
  الترقيم اليوناني.
