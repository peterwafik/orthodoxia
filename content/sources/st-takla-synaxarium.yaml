notes: >-
  The full text of every day's commemorations, in Arabic and English, collected by scripts/synaxarium/fetch.ts from
  St-Takla.org's Arabic Synaxarium and its English Synaxarium (data/synaxarium/synaxarium.json) and shown on the
  Calendar & Synaxarium day pages. The text is unchanged except that the site's navigation, image captions and notes
  are left out. Imported by the owner's decision, without a licence: St-Takla's permission has been asked for.
notesAr: >-
  النص الكامل لتذكارات كل يوم بالعربية والإنجليزية، جمعه السكربت scripts/synaxarium/fetch.ts من السنكسار العربي
  والسنكسار الإنجليزي في موقع الأنبا تكلا، ويُعرض في صفحات التقويم والسنكسار. النص دون تعديل سوى حذف عناصر التنقل
  وتعليقات الصور وملاحظات الموقع. أُدرج بقرار صاحب المشروع دون ترخيص، وقد طُلب إذن موقع الأنبا تكلا.
