notes: >-
  PROVENANCE UNDER REVIEW. The pages were added anonymously in 2011 without naming their source.
  The wording and numbering follow the Latin Vulgate tradition (e.g. Tobit 1:1 mentions Sephet/صفت,
  and Sirach has about 1,590 verses against about 1,370 in the Septuagint), which suggests the 19th-century
  Jesuit Arabic translation (Beirut, 1876–1880). That translation would itself be public domain. It
  differs in places from the Septuagint text the Coptic Orthodox Church follows, and the reader says
  so on every page that uses it. The derived dataset is shared under CC BY-SA 4.0. Sirach 29:16–17 are
  absent from the source. There is no Psalm 151 and no separate Letter of Jeremiah (it is Baruch 6).
