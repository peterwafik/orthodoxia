notes: Default English edition of the Bible reader (Old Testament, deuterocanon, New Testament). In the United Kingdom, printing the KJV is subject to the Crown's letters patent; eBible.org states this has no effect elsewhere, and online display is not printing. Raw file pinned by SHA-256 in data/bible/sources.json. The 1 Esdras, 2 Esdras and Prayer of Manasseh books it contains are not used, because they are outside the Coptic Orthodox canon.
